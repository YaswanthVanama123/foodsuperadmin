<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty Support Tickets Illustration -->
  <defs>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="ticket-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="140" r="115" fill="url(#ticket-grad)" opacity="0.3"/>

  <!-- Headset Icon (Support) -->
  <g transform="translate(160, 80)">
    <!-- Headband -->
    <path d="M 10 40 Q 10 10 40 10 Q 70 10 70 40"
          fill="none"
          stroke="url(#ticket-accent)"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="0" y="40" width="20" height="35" rx="10"
          fill="#1e293b"
          stroke="url(#ticket-accent)"
          stroke-width="3"/>
    <rect x="4" y="45" width="12" height="25" rx="6"
          fill="#8b5cf6"
          opacity="0.3"/>

    <!-- Right Ear Cup -->
    <rect x="60" y="40" width="20" height="35" rx="10"
          fill="#1e293b"
          stroke="url(#ticket-accent)"
          stroke-width="3"/>
    <rect x="64" y="45" width="12" height="25" rx="6"
          fill="#8b5cf6"
          opacity="0.3"/>

    <!-- Microphone -->
    <path d="M 10 65 Q 15 85 25 85"
          fill="none"
          stroke="url(#ticket-accent)"
          stroke-width="3"
          stroke-linecap="round"/>
    <circle cx="25" cy="85" r="4" fill="url(#ticket-accent)"/>
  </g>

  <!-- Ticket/Message Cards -->
  <g transform="translate(120, 140)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="160" height="45" rx="6"
          fill="#1e293b"
          stroke="#334155"
          stroke-width="2"
          opacity="0.6"/>
    <line x1="12" y1="15" x2="100" y2="15"
          stroke="#475569"
          stroke-width="2.5"
          stroke-linecap="round"/>
    <line x1="12" y1="28" x2="70" y2="28"
          stroke="#475569"
          stroke-width="2"
          stroke-linecap="round"/>
    <circle cx="140" cy="22.5" r="8"
            fill="none"
            stroke="#64748b"
            stroke-width="2"/>

    <!-- Card 2 (Slightly offset and more transparent) -->
    <rect x="10" y="20" width="160" height="45" rx="6"
          fill="#1e293b"
          stroke="#334155"
          stroke-width="2"
          opacity="0.4"/>

    <!-- Card 3 (More offset and even more transparent) -->
    <rect x="20" y="40" width="160" height="45" rx="6"
          fill="#1e293b"
          stroke="#334155"
          stroke-width="2"
          opacity="0.2"/>
  </g>

  <!-- Floating Question Marks -->
  <g opacity="0.4">
    <text x="90" y="110" font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="700" fill="#8b5cf6">
      ?
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="300" y="100" font-family="system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="700" fill="#a855f7">
      ?
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="310" y="200" font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="700" fill="#8b5cf6">
      ?
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Text -->
  <text x="200" y="250" font-family="system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    No Support Tickets
  </text>
  <text x="200" y="275" font-family="system-ui, -apple-system, sans-serif"
        font-size="14" fill="#64748b" text-anchor="middle">
    Support tickets will appear here
  </text>
</svg>
