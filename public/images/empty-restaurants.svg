<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty Restaurants Illustration -->
  <defs>
    <linearGradient id="restaurant-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="restaurant-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="140" r="110" fill="url(#restaurant-grad)" opacity="0.3"/>

  <!-- Restaurant Building -->
  <g transform="translate(150, 70)">
    <!-- Main Building -->
    <rect x="0" y="50" width="100" height="110" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Roof -->
    <path d="M -10 50 L 50 20 L 110 50 Z" fill="#334155" stroke="#475569" stroke-width="2"/>

    <!-- Chimney -->
    <rect x="70" y="10" width="15" height="20" fill="#475569" stroke="#64748b" stroke-width="1.5"/>

    <!-- Awning -->
    <path d="M 10 80 Q 50 90 90 80 L 90 85 Q 50 95 10 85 Z" fill="#ef4444" opacity="0.8"/>
    <line x1="20" y1="80" x2="20" y2="85" stroke="#b91c1c" stroke-width="1"/>
    <line x1="50" y1="82" x2="50" y2="90" stroke="#b91c1c" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="85" stroke="#b91c1c" stroke-width="1"/>

    <!-- Door -->
    <rect x="35" y="120" width="30" height="40" rx="2" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <circle cx="58" cy="140" r="2" fill="#64748b"/>

    <!-- Windows -->
    <rect x="15" y="100" width="15" height="15" rx="1" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="70" y="100" width="15" height="15" rx="1" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <line x1="22.5" y1="100" x2="22.5" y2="115" stroke="#334155" stroke-width="1"/>
    <line x1="15" y1="107.5" x2="30" y2="107.5" stroke="#334155" stroke-width="1"/>
    <line x1="77.5" y1="100" x2="77.5" y2="115" stroke="#334155" stroke-width="1"/>
    <line x1="70" y1="107.5" x2="85" y2="107.5" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Cutlery Icon (Crossed Out) -->
  <g transform="translate(240, 100)">
    <!-- Fork -->
    <line x1="5" y1="0" x2="5" y2="40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="10" y2="15" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Knife -->
    <line x1="25" y1="0" x2="25" y2="40" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 20 0 L 30 0 L 25 10 Z" fill="#64748b"/>

    <!-- X Mark -->
    <line x1="0" y1="0" x2="30" y2="40" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="30" y1="0" x2="0" y2="40" stroke="#ef4444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Floating Elements -->
  <circle cx="90" cy="100" r="3" fill="#ef4444" opacity="0.3">
    <animate attributeName="cy" values="100;95;100" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="120" r="2.5" fill="#f97316" opacity="0.3">
    <animate attributeName="cy" values="120;115;120" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="220" r="2" fill="#ef4444" opacity="0.3">
    <animate attributeName="cy" values="220;215;220" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    No Restaurants Found
  </text>
  <text x="200" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Restaurants will appear here once added
  </text>
</svg>
