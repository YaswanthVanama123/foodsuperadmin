<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Professional Empty State -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="150" r="120" fill="url(#grad1)" opacity="0.3"/>

  <!-- Document/Folder Icon -->
  <g transform="translate(140, 80)">
    <!-- Folder Base -->
    <rect x="0" y="20" width="120" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 0 30 L 50 10 L 100 10 L 120 30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="20" width="120" height="15" fill="#334155" opacity="0.5"/>

    <!-- Empty Lines -->
    <line x1="20" y1="50" x2="100" y2="50" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="20" y1="65" x2="80" y2="65" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="20" y1="80" x2="90" y2="80" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#grad2)" stroke-width="4"/>
    <line x1="18" y1="18" x2="35" y2="35" stroke="url(#grad2)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="100" cy="100" r="3" fill="#3b82f6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="90" r="2" fill="#8b5cf6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="220" r="2.5" fill="#3b82f6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="200" r="3" fill="#8b5cf6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text x="200" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    No Data Available
  </text>
  <text x="200" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    Data will appear here when available
  </text>
</svg>
