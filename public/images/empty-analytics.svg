<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty Analytics Illustration -->
  <defs>
    <linearGradient id="analytics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="analytics-accent1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="analytics-accent2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="140" r="120" fill="url(#analytics-grad)" opacity="0.3"/>

  <!-- Chart Container -->
  <g transform="translate(100, 70)">
    <!-- Chart Background -->
    <rect x="0" y="0" width="200" height="140" rx="8"
          fill="#1e293b"
          stroke="#334155"
          stroke-width="2"/>

    <!-- Grid Lines -->
    <line x1="20" y1="30" x2="180" y2="30" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="55" x2="180" y2="55" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="105" x2="180" y2="105" stroke="#334155" stroke-width="1" opacity="0.5"/>

    <!-- Y-Axis -->
    <line x1="20" y1="20" x2="20" y2="120" stroke="#475569" stroke-width="2"/>
    <!-- X-Axis -->
    <line x1="20" y1="120" x2="180" y2="120" stroke="#475569" stroke-width="2"/>

    <!-- Empty Bar Charts with Dots -->
    <g opacity="0.3">
      <!-- Bar 1 -->
      <rect x="35" y="110" width="20" height="10" rx="2" fill="url(#analytics-accent1)"/>
      <circle cx="45" cy="105" r="3" fill="#06b6d4">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Bar 2 -->
      <rect x="70" y="105" width="20" height="15" rx="2" fill="url(#analytics-accent2)"/>
      <circle cx="80" cy="98" r="3" fill="#8b5cf6">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Bar 3 -->
      <rect x="105" y="108" width="20" height="12" rx="2" fill="url(#analytics-accent1)"/>
      <circle cx="115" cy="102" r="3" fill="#06b6d4">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Bar 4 -->
      <rect x="140" y="112" width="20" height="8" rx="2" fill="url(#analytics-accent2)"/>
      <circle cx="150" cy="107" r="3" fill="#8b5cf6">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Dashed Line (Trend) -->
    <path d="M 45 105 L 80 98 L 115 102 L 150 107"
          stroke="#64748b"
          stroke-width="2"
          stroke-dasharray="4,4"
          fill="none"
          opacity="0.4"/>
  </g>

  <!-- Pie Chart Icon -->
  <g transform="translate(260, 150)">
    <circle cx="30" cy="30" r="28" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Pie Segments (Empty/Muted) -->
    <path d="M 30 30 L 30 2 A 28 28 0 0 1 51 15 Z" fill="#475569" opacity="0.3"/>
    <path d="M 30 30 L 51 15 A 28 28 0 0 1 51 45 Z" fill="#06b6d4" opacity="0.2"/>
    <path d="M 30 30 L 51 45 A 28 28 0 0 1 9 45 Z" fill="#8b5cf6" opacity="0.2"/>
    <path d="M 30 30 L 9 45 A 28 28 0 0 1 30 2 Z" fill="#64748b" opacity="0.3"/>

    <!-- Center Hole (Donut) -->
    <circle cx="30" cy="30" r="18" fill="#1e293b"/>
  </g>

  <!-- Floating Data Points -->
  <circle cx="85" cy="50" r="2.5" fill="#06b6d4" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="315" cy="80" r="2" fill="#8b5cf6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="220" r="3" fill="#0ea5e9" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    No Analytics Data
  </text>
  <text x="200" y="270" font-family="system-ui, -apple-system, sans-serif"
        font-size="14" fill="#64748b" text-anchor="middle">
    Analytics will appear when data is collected
  </text>
</svg>
